name: Release

# Publishing happens from CI, never from a laptop, so the tarball on the registry is always the
# one this workflow built from a reviewed commit.
#
# Auth is npm Trusted Publishing (OIDC): npm exchanges this job's short-lived GitHub identity
# token for a publish grant scoped to this repo and this workflow file. There is no long-lived
# NPM_TOKEN to leak, and it satisfies the org's 2FA-on-write policy without a bypass-2FA token -
# which matters, because npm stops honouring those for direct publishing in Jan 2027.
#
# Provenance is deliberately OFF: npm only accepts provenance attestations from public source
# repositories, and this repo is private. Trusted publishing turns provenance ON by default, so
# it has to be switched back off explicitly here. Drop NPM_CONFIG_PROVENANCE the moment the repo
# goes public - the attestation is worth having for a package that handles API keys and is sold
# on file integrity.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Node 24, not 22: trusted publishing needs npm >= 11.5.1 and Node 22 bundles npm
      # 10.9.x, which has no OIDC handshake - it fails with a 404 that appears to blame the
      # package rather than the CLI. Node 24 ships npm 11.x. Keep this at 24 or higher.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Both guards run before `npm ci`, so a wrong version number costs ~10s instead of a
      # full build and test run. They query the registry over plain HTTPS rather than with
      # `npm view`, because setup-node leaves an .npmrc pointing _authToken at an empty
      # NODE_AUTH_TOKEN (auth comes from OIDC now) and npm commands can trip over that.
      #
      # The registry is immutable: a published version can never be replaced, so the only
      # recovery from shipping the wrong number is spending another one.
      - name: Refuse to republish a version already on the registry
        run: |
          name=$(node -p "require('./package.json').name.replace('/', '%2f')")
          version=$(node -p "require('./package.json').version")
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
          case "$status" in
            404) echo "$version is not on the registry yet - proceeding." ;;
            200) echo "::error::$version is already published. Bump the version in package.json." ; exit 1 ;;
            *)   echo "::error::Could not reach the registry to check $version (HTTP $status)." ; exit 1 ;;
          esac

      # A tag that disagrees with package.json publishes a version nobody asked for, and
      # leaves the tag pointing at the wrong commit permanently.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$version'."
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: false
