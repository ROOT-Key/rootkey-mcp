name: Release

# Publishing happens from CI, never from a laptop, so the tarball on the registry is always the
# one this workflow built from a reviewed commit.
#
# Auth is npm Trusted Publishing (OIDC): npm exchanges this job's short-lived GitHub identity
# token for a publish grant scoped to this repo and this workflow file. There is no long-lived
# NPM_TOKEN to leak, and it satisfies the org's 2FA-on-write policy without a bypass-2FA token -
# which matters, because npm stops honouring those for direct publishing in Jan 2027.
#
# Provenance is deliberately OFF: npm only accepts provenance attestations from public source
# repositories, and this repo is private. Trusted publishing turns provenance ON by default, so
# it has to be switched back off explicitly here. Drop NPM_CONFIG_PROVENANCE the moment the repo
# goes public - the attestation is worth having for a package that handles API keys and is sold
# on file integrity.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Node 24, not 22: trusted publishing needs npm >= 11.5.1 and Node 22 bundles npm
      # 10.9.x, which has no OIDC handshake - it fails with a 404 that appears to blame the
      # package rather than the CLI. Node 24 ships npm 11.x. Keep this at 24 or higher.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: false
