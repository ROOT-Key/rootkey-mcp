name: Release

# Publishing happens from CI, never from a laptop, so the tarball on the registry is always the
# one this workflow built from a reviewed commit.
#
# Provenance is deliberately OFF: npm only accepts provenance attestations from public source
# repositories, and this repo is private. Re-add `--provenance` (plus publishConfig.provenance)
# the moment the repo goes public - the attestation is worth having for a package that handles
# API keys and is sold on file integrity.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
